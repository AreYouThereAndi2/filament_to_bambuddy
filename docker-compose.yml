services:
  filament-to-bambuddy:
    build:
      context: .
      args:
        # Shown in the page footer. Set it when building from a checkout:
        #   F2B_VERSION=$(git describe --tags --always) docker compose up -d --build
        VERSION: ${F2B_VERSION:-dev}
    # Or, once this fork publishes an image (GitHub Actions switched on):
    # image: ghcr.io/areyouthereandi2/filament_to_bambuddy:latest
    container_name: filament_to_bambuddy
    restart: unless-stopped
    ports:
      - "8088:8088"
    # Config comes from a .env file beside this compose file (gitignored):
    #   BAMBUDDY_URL=https://your-bambuddy.example.com
    #   BAMBUDDY_API_KEY=bb_xxx
    #   # optional: DEFAULT_LABEL_WEIGHT, UPCITEMDB_KEY, UPC_LOOKUP=off, TIGERTAG=off
    env_file:
      - .env
    volumes:
      - filament_data:/data   # persists barcode_cache.json + the database indexes

volumes:
  filament_data:
